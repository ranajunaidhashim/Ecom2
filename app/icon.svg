<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep luxury onyx/rose-gold glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#141318" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Metallic Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2e9" />
      <stop offset="25%" stop-color="#f5d0b5" />
      <stop offset="55%" stop-color="#e09f7d" />
      <stop offset="85%" stop-color="#c97a56" />
      <stop offset="100%" stop-color="#f7ddc9" />
    </linearGradient>

    <!-- Subtle Golden Shimmer for Ring Accent -->
    <linearGradient id="goldShimmer" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#e8b99e" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#b86948" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Frame with luxury dark tone -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#roseGold)" stroke-width="6" />

  <!-- Inner Delicate Concentric Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Luxurious Central Monogram (V intertwining with C) -->
  <g filter="url(#softGlow)" transform="translate(0, -6)">
    <!-- Elegant stylized 'C' embracing the 'V' -->
    <path
      d="M 330 180
         C 290 135, 190 135, 145 190
         C 100 245, 105 325, 155 370
         C 195 405, 275 410, 320 375
         C 335 363, 342 348, 335 340
         C 328 332, 315 334, 302 344
         C 268 370, 206 366, 175 336
         C 138 300, 134 238, 168 196
         C 202 154, 276 152, 312 188
         C 324 200, 336 195, 340 188
         C 342 184, 338 180, 330 180 Z"
      fill="url(#goldShimmer)"
      opacity="0.85"
    />

    <!-- Regal Serifed 'V' in Rose Gold -->
    <!-- Left Stem: graceful thick downstroke -->
    <path
      d="M 178 180
         L 242 360
         Q 256 394, 258 394
         Q 260 394, 274 360
         L 338 180
         C 344 164, 330 162, 314 162
         L 300 162
         L 256 322
         L 212 162
         L 198 162
         C 182 162, 172 164, 178 180 Z"
      fill="url(#roseGold)"
    />

    <!-- Diamond / Star Accent at the apex -->
    <path
      d="M 256 122
         Q 256 138, 268 138
         Q 256 138, 256 154
         Q 256 138, 244 138
         Q 256 138, 256 122 Z"
      fill="url(#roseGold)"
    />
  </g>

  <!-- Wordmark Arc / Bottom Inscription: VELLOURA -->
  <text
    x="256"
    y="435"
    text-anchor="middle"
    font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Cinzel', serif, system-ui"
    font-size="28"
    font-weight="700"
    letter-spacing="9"
    fill="url(#roseGold)"
  >
    VELLOURA
  </text>
  
  <text
    x="256"
    y="458"
    text-anchor="middle"
    font-family="'Montserrat', 'Inter', sans-serif"
    font-size="12"
    font-weight="500"
    letter-spacing="6"
    fill="#f5d0b5"
    opacity="0.8"
  >
    COLLECTIVE
  </text>
</svg>
